; PlatformIO project for the red light / green light game.
;
; The sketch folder is the PlatformIO source directory, so the same files work
; in the Arduino IDE (open firmware/traffic/Traffic.ino).
;
;   pio run                 build the DigiSpark target
;   pio run -t upload       flash over the micronucleus bootloader
;   pio test -e native      run the host-side schedule tests

[platformio]
src_dir = traffic
default_envs = digispark-tiny

[env:digispark-tiny]
platform = atmelavr
board = digispark-tiny
framework = arduino
lib_deps = adafruit/Adafruit NeoPixel@^1.12.0
build_flags = -Wall

[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags = -I${PROJECT_DIR}/traffic -std=gnu++11
